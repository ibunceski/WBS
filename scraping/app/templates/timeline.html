{% extends "base.html" %}
{% block title %}Timeline | Macedonian History KG{% endblock %}
{% block content %}
<section class="page-heading">
  <p>Historical Events</p>
  <h1>Chronological timeline</h1>
  <span>Events are ordered by known start date and enriched with place and description when available.</span>
</section>

<form class="panel grid gap-4 sm:grid-cols-[1fr_1fr_auto_auto]" hx-get="/timeline/results" hx-target="#timeline-results" hx-indicator="#timeline-loading">
  <label class="control-label">From
    <input class="input" type="date" name="start">
  </label>
  <label class="control-label">To
    <input class="input" type="date" name="end">
  </label>
  <button class="primary-button self-end" type="submit">Filter</button>
  <button class="secondary-button self-end" type="button"
          onclick="this.closest('form').reset(); htmx.ajax('GET', '/timeline/results', { target: '#timeline-results', indicator: '#timeline-loading' });">Reset</button>
</form>
<div id="timeline-loading" class="htmx-indicator mt-4 text-sm text-amber-800">Loading timeline...</div>
<div id="timeline-results" class="mt-8" hx-get="/timeline/results" hx-trigger="load" hx-indicator="#timeline-loading"></div>
{% endblock %}
